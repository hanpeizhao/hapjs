// 根构建脚本：构建 annotation 系列 Gradle 插件（executor/generator）与注解/处理器库。
// 产物 jar 会复制到 prebuilts/<version>/，供主工程（mockup/platform/android）经
// prebuilts/<version>/buildscript.gradle 注入 buildscript classpath 使用。
// 工具链要求：Gradle 9.6.0 + JDK 17+（需与主工程使用的 Gradle 版本一致，保证插件二进制兼容）。

buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        google()
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        mavenCentral()
    }
}

static String guessGroup(Project project) {
    if (project.projectDir.absolutePath.contains("gradle-plugin")) {
        "org.hapjs.gradle.plugin"
    } else {
        "org.hapjs"
    }
}

subprojects {
    group guessGroup(project)

    project.version = "2.3.0"

    // 旧 maven/uploadArchives 插件已废弃，改用 maven-publish（publishToMavenLocal 等价）
    apply plugin: 'maven-publish'
    afterEvaluate {
        publishing {
            publications {
                maven(MavenPublication) {
                    groupId = project.group
                    artifactId = project.name
                    version = project.version
                    from components.java
                }
            }
            repositories {
                if ('remote' == project.properties['repoType']) {
                    maven {
                        name 'snapshots'
                        url project.properties['snapshotRepo']
                        credentials {
                            username project.properties['repoUser']
                            password project.properties['repoPassword']
                        }
                    }
                    maven {
                        name 'releases'
                        url project.properties['releaseRepo']
                        credentials {
                            username project.properties['repoUser']
                            password project.properties['repoPassword']
                        }
                    }
                }
            }
        }

        // 保持原行为：assemble 完成后把 *-<version>.jar 复制到 prebuilts/<version>/
        // （Gradle 9 任务懒创建，须在 afterEvaluate 后任务才存在）
        tasks.named('assemble') {
            doLast {
                copy {
                    from project.layout.buildDirectory.dir("libs")
                    into "${rootProject.projectDir.absolutePath}/prebuilts/${project.version}"
                    include "*-${project.version}.jar"
                }
            }
        }
    }
}
