plugins {
    id "java-gradle-plugin"
    id "groovy"
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'com.sun.codemodel:codemodel:2.6'
    // JDK 9+ 已无 tools.jar（getToolsJar() 返回 null），仅在 JDK 8 下引入
    def toolsJar = org.gradle.internal.jvm.Jvm.current().getToolsJar()
    if (toolsJar != null) {
        compileOnly files(toolsJar)
    }
    implementation project(":annotation-processor")
}

gradlePlugin {
    plugins {
        generatorPlugin {
            id = 'org.hapjs.gradle.plugin.annotation.generator'
            implementationClass = 'org.hapjs.build.AnnotationGeneratorPlugin'
        }
    }
}
