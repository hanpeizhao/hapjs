android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "org.hapjs.debugger"
    }

    signingConfigs {
        release {
            // 与平台包保持同证书（原 debug-key.keystore 与平台包 debug.keystore 不是同一证书，
            // 会导致平台包 PermissionChecker.checkSignatures 校验失败、拒绝调试请求）
            storeFile rootProject.file('../../../mockup/platform/android/app/debug.keystore')
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    if ('repo' != System.properties['moduleDepsType']) {
        implementation project(':app-impl')
    } else {
        implementation 'org.hapjs:app-impl:' + rootProject.appVersionName
    }
}

// AGP 8+ 要求显式 namespace（Manifest 的 package 属性已移除）
android {
    namespace 'org.hapjs.debugger'
}
