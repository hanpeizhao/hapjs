# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX（AGP 9 已彻底移除 Jetifier，工程内已无 support 库依赖，无需再开启 android.enableJetifier）
android.useAndroidX=true
# 保持与旧版构建一致的行为：
# - nonTransitiveRClass=false：模块代码可能引用依赖模块的 R 常量
# - nonFinalResIds=false：部分代码在 switch 语句中使用 R 常量（要求 final）
# 注：android.defaults.buildfeatures.buildconfig 在 AGP 9 已移除，buildConfig 改为在根 build.gradle 统一开启
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# List of CPU Archtexture to build that application with
# Available architextures (armeabi-v7a | arm64-v8a | x86)
# To build for multiple architexture, use the `:` between them
# Example - PROP_APP_ABI=armeabi-v7a:arm64-v8a:x86
#PROP_APP_ABI_DEBUG= armeabi-v7a:arm64-v8a
#PROP_APP_ABI_RELEASE= armeabi-v7a:arm64-v8a

# runtime module open debugMode. Release mode must use false.
#debugMode=false
# runtime module ignore copy infras JS task. Release mode must use false.
#ENABLE_INFRAS_JS_CACHE=false
# enbale external Native Build Clean cache. Release mode must use false.
#ENABLE_NATIVE_BUILD_CLEAN_CACHE = false
