// 根构建脚本：统一为全部子工程应用插件并配置公共 Android 选项。
// 工具链要求：AGP 9.2.1 + Gradle 9.6.0 + JDK 17+（Android Studio 自带的 JBR 21 可直接使用）。
// 说明：AGP 上限以 IDE 支持为准（Studio 2026.1.1 "Quail" 最高支持 AGP 9.2.1），不要随意升级。
// 说明：本工程不含任何 Kotlin 源码，依赖 AGP 内置 Kotlin 能力即可，无需单独应用 Kotlin 插件。

buildscript {
    repositories {
        // 直连 google/mavenCentral 超时的网络环境下，优先使用国内镜像（腾讯镜像对 AGP 与
        // node-gradle 等插件的同步比阿里云更全），google() 直连仅作为兜底放在最后
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        // node-gradle 7.x：替代已停止维护的 moowork gradle-node-plugin，用于编译 framework.js
        classpath 'com.github.node-gradle:gradle-node-plugin:7.1.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
    apply from: '../../../development/gradle-plugin/prebuilts/2.3.0/buildscript.gradle', to: buildscript
}

// 应用版本号计算与公共依赖版本定义
apply from: '../../../core/runtime/android/version.gradle', to: rootProject
apply from: '../../../core/runtime/android/config.gradle', to: rootProject

allprojects {
    repositories {
        // node-gradle 7.x 以 maven 依赖方式解析 Node 发行版（org.nodejs:node，maven 布局），
        // 国内镜像均无此 artifact，构建前须按 doc/PROJECT_GUIDE.md 说明将其放入 ~/.m2/manual-repo
        // （GitHub Actions CI 由 .github/workflows/android-build.yml 自动搭建该仓库）
        maven { url "file:///${System.getProperty('user.home').replace('\\', '/')}/.m2/manual-repo" }
        if ('remote' != project.properties['repoType']) {
            mavenLocal()
        } else {
            maven { url project.properties['privateRepo'] }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        mavenCentral()
        google()
    }
}

def javaModules = ['card-api', 'annotation', 'annotation-processor']
def applicationModules = ['app']
def ndkBuildModules = ['inspector']
def runtimeModule = 'runtime'

if (project.properties['useSpecifiedNdk'] == 'true') {
    exec {
        File rootPathFile = file('../../../../')
        File v8ToolsFile = file('../../../external/v8/third_party/android_tools')
        workingDir '../../../external/public'

        commandLine 'python', 'ndk_build.py', '--root-path', rootPathFile.absolutePath,
                '--v8-tools-path', v8ToolsFile.absolutePath
    }
}

// setting ndk build abi filters
def setNdkAbiFilters(project) {
    project.android {
        buildTypes {
            def debugAbi = '', releaseAbi = ''
            if (project.hasProperty('PROP_APP_ABI_DEBUG')) {
                debugAbi = project.getProperty('PROP_APP_ABI_DEBUG')
            }
            if (project.hasProperty('PROP_APP_ABI_RELEASE')) {
                releaseAbi = project.getProperty('PROP_APP_ABI_RELEASE')
            }
            if (debugAbi == '') {
                debugAbi = releaseAbi
            }
            // must setting release ndk build
            if (releaseAbi == '') {
                debugAbi = ''
            }
            // set default ndk build
            if (releaseAbi == '' && debugAbi == '') {
                releaseAbi = debugAbi = 'armeabi-v7a:arm64-v8a:x86:x86_64'
            }
            def isChecked = true
            if (project.name == 'runtime' && project.properties['useInfrasJsSnapshot'] != 'true') {
                isChecked = false
            }
            if (debugAbi != '' && isChecked) {
                debug {
                    ndk {
                        String[] abis = debugAbi.split(':')
                        for (def abi : abis) {
                            abiFilters abi
                        }
                    }
                }
            }
            if (releaseAbi != '' && isChecked) {
                release {
                    ndk {
                        String[] abis = releaseAbi.split(':')
                        for (def abi : abis) {
                            abiFilters abi
                        }
                    }
                }
            }
        }
    }
}

// ignore runtime:copyInfrasJS task
static boolean isIgnoreCopyInfrasJSTask(project) {
    def enableInfrasJsCache = project.properties['ENABLE_INFRAS_JS_CACHE'] == 'true'
    if (enableInfrasJsCache) {
        def srcDir = project.getProjectDir().path + "/src/main/assets/js/"
        File srcFile = new File(srcDir)
        def ignoreCopyInfrasJSTask = srcFile?.listFiles()?.size() > 0 && enableInfrasJsCache
        return ignoreCopyInfrasJSTask
    }
    return false
}

subprojects {
    switch (project.name) {
        case javaModules:
            // java-library：card-api 需要通过 api 配置传递本地 jar 依赖
            apply plugin: 'java-library'
            group "org.hapjs"
            version rootProject.appVersionName
            return
        case applicationModules:
            apply plugin: 'com.android.application'
            setNdkAbiFilters(project)
            break
        case runtimeModule:
            apply plugin: 'com.android.library'
            // setting ndk build abi filters
            setNdkAbiFilters(project)
            // optimized runtime:copyInfrasJS task
            project.afterEvaluate {
                if (!isIgnoreCopyInfrasJSTask(project)) {
                    project.tasks.named('preBuild') { dependsOn 'copyInfrasJS' }
                }
            }
            break
        case ndkBuildModules:
            apply plugin: 'com.android.library'
            // setting ndk build abi filters
            setNdkAbiFilters(project)
            break
        default:
            apply plugin: 'com.android.library'
            break
    }

    group "org.hapjs"
    version rootProject.appVersionName

    // 注解驱动代码生成插件（由 development/gradle-plugin 提供，经 prebuilts 预编译 jar 加载）
    apply plugin: 'org.hapjs.gradle.plugin.annotation.executor'
    apply plugin: 'org.hapjs.gradle.plugin.annotation.generator'

    android {
        // namespace 由各模块 build.gradle 显式声明（AGP 8+ 要求，Manifest 的 package 属性已移除）
        // AGP 8.9+ 的 minor 版本平台（android-36.1）须通过块 DSL 声明，字符串 "36.1" 不被解析
        compileSdk {
            version = release(rootProject.compileSdkVersion as int) {
                minorApiLevel = rootProject.compileSdkMinor as int
            }
        }
        // AGP 9 的默认 Build Tools 为 36.0.0，SDK 中未安装，显式对齐本地已装版本
        buildToolsVersion rootProject.buildToolsVersion
        defaultConfig {
            // AGP 8 起强制最低 minSdk 21
            minSdk 21
            versionCode rootProject.appVersionCode
            versionName rootProject.appVersionName
            testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        }
        // AGP 9 起 targetSdk 仅允许在 application 模块声明
        if (project.name in applicationModules) {
            defaultConfig {
                targetSdk 24
            }
        }
        signingConfigs {
            core {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
            release {
                if ('true' == project.properties['signMode']) {
                    storeFile file(project.properties['storeFile'])
                    storePassword project.properties['storePassword']
                    keyAlias project.properties['keyAlias']
                    keyPassword project.properties['keyPassword']
                }
            }
        }
        lint {
            checkReleaseBuilds false
            abortOnError false
            lintConfig rootProject.file('static-analysis-filters/lint-rules.xml')
            xmlOutput file("${project.rootDir}/build/reports/lint-results_${project.name}.xml")
        }
        buildTypes {
            debug {
                if (!project.hasProperty("useSysSig")) {
                    println 'use default sig'
                    signingConfig signingConfigs.core
                } else {
                    println 'use system sig'
                }
            }
            release {
                if ('true' == project.properties['signMode']) {
                    signingConfig signingConfigs.release
                } else {
                    signingConfig signingConfigs.core
                }
                if (project.name in applicationModules) {
                    minifyEnabled 'true' != project.properties['debugMode']
                    // AGP 9 起不再提供 proguard-android.txt（含 -dontoptimize），统一改用 optimize 版本
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        flavorDimensions += "platform"
        // AGP 9 起默认关闭 BuildConfig 生成，而多个模块使用 buildConfigField，这里统一开启
        buildFeatures {
            buildConfig true
        }
        // 锁定 Java 8 语法级别，与旧版构建行为保持一致
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
        productFlavors {
            phone {
                dimension "platform"
            }
            tv {
                dimension "platform"
            }
            car {
                dimension "platform"
            }
        }
    }

    dependencies {
        api fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
        // 工程为纯 Java 源码，注解处理走标准 javac annotationProcessor
        annotationProcessor project(':annotation-processor')
        androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
            exclude group: 'com.android.support', module: 'support-annotations'
            exclude group: 'com.google.code.findbugs', module: 'jsr305'
        })
        androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
        testImplementation 'junit:junit:4.12'
    }

    configurations.configureEach {
        exclude group: 'com.facebook.soloader', module: 'annotation'
    }
}

// 发布配置：旧 uploadArchives/maven 插件已废弃，改用 maven-publish。
// 本地开发使用 publishToMavenLocal；CI 远程仓库通过 -PrepoType=remote 及相关属性配置。
subprojects {
    if (!applicationModules.contains(project.name)) {
        apply plugin: 'maven-publish'
        afterEvaluate {
            publishing {
                publications {
                    maven(MavenPublication) {
                        groupId = "org.hapjs"
                        artifactId = project.name
                        version = rootProject.appVersionName
                        // AGP 9：Android 库的 SoftwareComponent 'release' 已随旧 Variant API 移除，
                        // java 模块仍走 components.java；如需远端发布 AAR，须改用 AGP 9 新发布 API
                        def releaseComponent = project.components.findByName('release')
                        if (releaseComponent != null) {
                            from releaseComponent
                        } else if (project.plugins.hasPlugin('java')) {
                            from components.java
                        } else if (!project.plugins.hasPlugin('com.android.application')) {
                            logger.lifecycle("WARN: ${project.name} 无可用 SoftwareComponent，publication 无内容")
                        }
                    }
                }
                repositories {
                    if ('remote' == project.properties['repoType']) {
                        maven {
                            name 'snapshots'
                            url project.properties['snapshotRepo']
                            credentials {
                                username project.properties['repoUser']
                                password project.properties['repoPassword']
                            }
                        }
                        maven {
                            name 'releases'
                            url project.properties['releaseRepo']
                            credentials {
                                username project.properties['repoUser']
                                password project.properties['repoPassword']
                            }
                        }
                    }
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
