// 代码风格检查配置：app 模块的独立 Checkstyle 任务，遍历仓库 Java 源码做静态检查
apply plugin: 'checkstyle'

checkstyle {
    toolVersion = "8.44"
}

tasks.register('checkstyle', Checkstyle) {
    description 'Runs Checkstyle inspection against Android sourcesets.'
    group = 'Code Quality'

    ignoreFailures = false
    showViolations = false
    // 需要排除一些未用到的模块中的文件，比如gcanvas-adapter, bridge_spec中的文件
    source '../../../../'
    include '**/*.java'
    exclude '**/gen/**', '**/src/androidTest/**', '**/app/build/generated/**'
    exclude '**/R.java'
    exclude '**/BuildConfig.java'
    reports {
        xml {
            // Gradle 9：Report.outputFile 已移除，改用 outputLocation（Property<RegularFile>）
            required = true
            outputLocation = project.layout.buildDirectory.file("reports/checkstyle-report.xml")
        }
    }
    classpath = files()
    configFile = file("${rootDir}/app/config/checkstyle.xml")

    configProperties.lineWidth = 120
}
