// 公共依赖版本定义：由各工程根 build.gradle apply 到 rootProject 使用。
// compileSdk/buildTools 需满足 AGP 9 的最低要求（build-tools >= 36.0.0）。
// compileSdk 采用 API 36 + minor 1（Android 16 QPR），与本地 SDK 已安装的
// platforms;android-36.1 对齐；AGP 8.9+ 要求通过 compileSdk { } 块 DSL 声明 minor。

project.ext {
    compileSdkVersion = 36
    compileSdkMinor = 1
    buildToolsVersion = "36.1.0"
    supportLibraryVersion = "28.0.0"
    androidXVersion = '1.2.1'
    appcompatVersion = '1.1.0'
    recyclerviewVersion = '1.1.0'
    exoplayerVersion = '2.8.2'
    androidCoreVersion = '1.2.0'
    exifVersion = '1.0.0'
    mediaVersion = '1.0.0'
    legacyVersion = '1.0.0'
    localbroadcastmanagerVersion = '1.0.0'
    annotationVersion = '1.1.0'
    swiperefreshlayoutVersion = '1.0.0'
    collectionVersion = '1.1.0'
    lifecycleVersion = '2.2.0'
    androidXconstraintlayoutVersion = '2.0.4'
}
