def getPlatformVersionCode() {
    def prop = System.properties['platformVersionCode']
    if (prop != null) {
        println 'platform versionCode is ' + prop + ' (specified)'
        return prop
    }
    int code = android.defaultConfig.versionCode / 10000
    println 'platform versionCode is ' + code
    return code.toString()
}

def getPlatformVersionName() {
    def prop = System.properties['platformVersionName']
    if (prop != null) {
        println 'platform versionName is ' + prop + ' (specified)'
        return prop
    }
    int code = android.defaultConfig.versionCode / 100000
    String name = (int) (code / 100) + '.' + (code % 100)
    println 'platform versionName is ' + name
    return name
}

String PLATFORM_VERSION_TEXT = getPlatformVersionCode()
String PLATFORM_VERSION_NAME = getPlatformVersionName()
def JSENV_VERSION = "1.2.8"

// add version file
tasks.register('addVersionFile', Exec) {
    def versionFilePath = "" + projectDir + "/src/main/resources/jsenv_version"
    File versionFile = new File(versionFilePath)
    versionFile.withOutputStream { os ->
        os << ("jsenv_aar_version = " + JSENV_VERSION).getBytes();
    }
}

android {
    buildTypes {
        debug {
            manifestPlaceholders = [platformVersion: PLATFORM_VERSION_TEXT, platformVersionName: PLATFORM_VERSION_NAME]
            buildConfigField "int", "platformVersion", PLATFORM_VERSION_TEXT
            buildConfigField "String", "platformVersionName", "\"" + PLATFORM_VERSION_NAME + "\""
        }
        release {
            manifestPlaceholders = [platformVersion: PLATFORM_VERSION_TEXT, platformVersionName: PLATFORM_VERSION_NAME]
            buildConfigField "int", "platformVersion", PLATFORM_VERSION_TEXT
            buildConfigField "String", "platformVersionName", "\"" + PLATFORM_VERSION_NAME + "\""
        }
    }
    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        // AGP 9 起 BuildConfig 不再自动生成 VERSION_NAME，改为显式声明以保持原语义
        buildConfigField "String", "VERSION_NAME", "\"" + android.defaultConfig.versionName + "\""
    }
}

dependencies {
    api "androidx.appcompat:appcompat:${rootProject.appcompatVersion}"
    api "androidx.collection:collection:${rootProject.collectionVersion}"
    api 'com.squareup.okhttp3:okhttp:3.12.3'
    api ('com.facebook.fresco:fresco:2.3.0') {
        exclude group: 'com.facebook.soloader', module: 'soloader'
        exclude group: 'com.facebook.fresco', module: 'soloader'
    }
    api 'com.facebook.fresco:animated-gif:2.3.0'
    api 'com.facebook.fresco:animated-webp:2.3.0'
    api 'com.facebook.fresco:animated-drawable:2.3.0'
    api 'com.facebook.yoga:yoga:1.19.0'
    // soloader 必须 ≥0.9（YogaNodeFactory 依赖 boolean 签名的 loadLibrary），
    // 与 fresco 2.3.0 的期望版本（0.10.1）对齐；根 build.gradle 中全局 force 0.10.1
    api 'com.facebook.soloader:soloader:0.10.1'
    api 'com.caverock:androidsvg:1.4'
    // soloader 0.10.1 不再传递 jsr305，而代码里使用了 javax.annotation.Nullable
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    api 'org.greenrobot:eventbus:3.1.1'
    api 'com.tencent:mmkv:1.2.1'
    compileOnly project(':card-api')
    api project(":annotation")
    implementation project(":debug-log")
    api 'com.google.zxing:core:3.1.0'

    // AGP 9：library 项目禁止以 fileTree/files 方式依赖本地 .aar（bundleAar 的
    // hasLocalAarDeps 检查直接失败）。jsenv 目录已注册为 flatDir 仓库（根 build.gradle），
    // 此处按 GAV 坐标解析 jsenv-<version>.aar（自包含 V8 引擎封装，无传递依赖）
    def jsenvArtifactId = 'jsenv'
    if ('true' == project.properties['noV8Symbols']) {
        jsenvArtifactId += '-no-v8symbols'
    }
    api "org.hapjs:$jsenvArtifactId:$JSENV_VERSION"
    implementation "androidx.recyclerview:recyclerview:${rootProject.recyclerviewVersion}"
    implementation "androidx.constraintlayout:constraintlayout:${rootProject.androidXconstraintlayoutVersion}"
    implementation "com.google.android.material:material:${rootProject.androidXVersion}"
}

// soloader 版本统一由根 build.gradle 的全局 force 管理（0.10.1）

import com.github.gradle.node.task.NodeTask

// framework.js 编译链：node-gradle 7.x（原 moowork 插件已停止维护），自动下载 Node 并执行 npm 构建脚本
apply plugin: 'com.github.node-gradle.node'

node {
    version = '12.13.0'
    // node-gradle 7.x 将 distBaseUrl 视为 maven 布局仓库（org.nodejs:node:<ver>:<os>-<arch>@zip），
    // nodejs.org/dist 等目录布局均不可用。置 null 后走项目仓库解析；发行版 zip 位于
    // ~/.m2/manual-repo/org/nodejs/node/12.13.0/（见根 build.gradle 仓库说明与 doc/PROJECT_GUIDE.md）。
    distBaseUrl = null
    download = true
    workDir = file("../.gradle/node")
    nodeProjectDir = file("../../../framework")
}

// node 12 自带的 npm.cmd 会探测全局 npm 并优先使用（本机全局为 npm 9，与 node 12 不兼容，
// 报 Cannot find module 'node:path'），故统一改用 NodeTask 直接执行发行版内的 npm-cli.js，
// 并通过 npm_config_prefix 将全局 prefix 指向空目录，使 npm run 内部递归调用 npm 时不再
// 跳回系统全局 npm。node 目录名规则为 node-v<version>-<os>-<arch>，随运行平台而异
// （Windows 发行版为 win-x64 zip，Linux 为 linux-x64 tar.gz），按 os.name 动态拼接；
// 且发行版内部结构不同：Windows zip 将 npm 置于 <dir>/node_modules/npm，
// Linux/Mac tar.gz 置于 <dir>/lib/node_modules/npm（bin/npm 仅是指向它的符号链接）
def isWindowsBuild = System.getProperty('os.name').toLowerCase().contains('windows')
def npmGlobalPrefix = file('../.gradle/node/npm-global').absolutePath
def npmCliFile = file("../.gradle/node/node-v12.13.0-${isWindowsBuild ? 'win-x64' : 'linux-x64'}/"
        + (isWindowsBuild ? 'node_modules/npm/bin/npm-cli.js' : 'lib/node_modules/npm/bin/npm-cli.js'))

tasks.register('npmInstallInfras', NodeTask) {
    dependsOn 'nodeSetup'
    // npm 依赖走国内镜像（npmmirror 与官方 registry 完全兼容）
    args = ['install', '--registry=https://registry.npmmirror.com']
    script.fileValue(npmCliFile)
    workingDir = file("../../../framework")
    environment = ['npm_config_prefix': npmGlobalPrefix]
}

tasks.register('buildInfrasJS', NodeTask) {
    dependsOn 'npmInstallInfras'
    script.fileValue(npmCliFile)
    args = ['run', ('true' != project.properties['debugMode']) ? 'native:release' : 'native']
    workingDir = file("../../../framework")
    environment = ['npm_config_prefix': npmGlobalPrefix]
}

tasks.register('copyInfrasJS', Copy) {
    dependsOn 'buildInfrasJS'
    from '../../../framework/dist/' + (('true' != project.properties['debugMode']) ? 'release' : 'debug')
    include 'infras.js', 'bundles/*.js', 'dsls/dsl-xvm.js', 'app/*/*.js'
    into 'src/main/assets/js'
}

tasks.register('cleanJS', Delete) {
    delete 'src/main/assets/js'
}
tasks.named('clean') { dependsOn 'cleanJS' }

// AGP 8+ 要求显式 namespace（Manifest 的 package 属性已移除）
android {
    namespace 'org.hapjs.runtime'
}
